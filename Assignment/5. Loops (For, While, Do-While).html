<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number 1 to 10</title>
</head>
<body>
    <button onclick="printNumbers()">Print Numbers 1 to 10</button>

    <script>
        function printNumbers() {
            let output = '';
            for (let i = 1; i <= 10; i++) {
                output += i + ' ';
            }
            alert(output.trim());
            console.log(output.trim());
        }
    </script>
</body>
</html>
