<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Events Assignment</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
            transition: background-color 0.5s ease;
        }

        #clock {
            font-size: 48px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Digital Clock</h1>
    <div id="clock">00:00:00</div>

    <script>
        // Task 1: Change background color after 5 seconds
        setTimeout(function () {
            document.body.style.backgroundColor = "lightblue";
        }, 5000);

        // Task 2: Digital clock updates every second
        function updateClock() {
            const now = new Date();
            const timeString = now.toLocaleTimeString();
            document.getElementById("clock").textContent = timeString;
        }

        updateClock();
        setInterval(updateClock, 1000);
    </script>
</body>
</html>
