<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>JavaScript Operators</title>
	<style>
		body { font-family: Arial, sans-serif; margin: 20px; }
	</style>
</head>
<body>
	<h1>JavaScript Operators</h1>

	<script>
		let a = 12;
		let b = 3;

		// Arithmetic operators
		document.write("<b>Arithmetic Operators:</b><br>");
		document.write("a = " + a + ", b = " + b + "<br>");
		document.write("a + b = " + (a + b) + "<br>");
		document.write("a - b = " + (a - b) + "<br>");
		document.write("a * b = " + (a * b) + "<br>");
		document.write("a / b = " + (a / b) + "<br><br>");

		// Comparison operators
		document.write("<b>Comparison Operators:</b><br>");
		document.write("a == b -> " + (a == b) + "<br>");
		document.write("a > b -> " + (a > b) + "<br>");
		document.write("a < b -> " + (a < b) + "<br><br>");

		// Logical operators
		document.write("<b>Logical Operators:</b><br>");
		document.write("(a > 10) && (b < 5) -> " + ((a > 10) && (b < 5)) + "<br>");
		document.write("(a > 10) || (b > 10) -> " + ((a > 10) || (b > 10)) + "<br>");
		document.write("!(a == b) -> " + (!(a == b)) + "<br>");
	</script>
</body>
</html>
