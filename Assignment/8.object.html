<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Object Assignment</title>
</head>
<body>
    <script>
        const car = {
            brand: "Toyota",
            model: "Corolla",
            year: 2020
        };

        console.log("Car brand:", car.brand);
        console.log("Car model:", car.model);

        car.year = 2024;
        console.log("Updated year:", car.year);

        car.color = "Black";
        console.log("Car object after adding color:", car);
    </script>
</body>
</html>
