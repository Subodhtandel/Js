<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
            function numberchecker() {
                let number = prompt("Enter a number:");

                let msg = (number>0)?"The number is positive.":"The number is not positive.";
                alert(msg);
            }

            function evenorodd() {
                let number = prompt("Enter a number:");
                let msg = (number % 2 === 0)?"The number is even.":"The number is odd.";
                alert(msg);
            }

            function markschecker() {
                let marks = prompt("Enter your marks:");

                if (marks >= 90) {
                    alert("Grade: A");
                } else if (marks >= 80) {
                    alert("Grade: B");
                } else if (marks >= 70) {
                    alert("Grade: C");
                } else if (marks >= 60) {
                    alert("Grade: D");
                } else {
                    alert("Grade: F");
                }
            }

    </script>
</head>
<body>
    <button onclick="numberchecker()">
        Number find
    </button>
    <button onclick="evenorodd()">
        evne or odd
    </button>
    <button onclick="markschecker()">
        Marks checker
    </button>
</body>
</html>
