<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Clock</title>
  <style>
    body {
      height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #00c6ff, #010101);
      font-family: 'Poppins', sans-serif;
    }

    .clock {
      padding: 60px 100px;
      border: 8px solid rgba(255, 255, 255, 0.6);
      border-radius: 25px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.4),
                  inset 0 0 10px rgba(255, 255, 255, 0.2);
      text-align: center;
      color: rgb(177, 1, 1);
      animation: pulse 3s infinite alternate;
    }

    @keyframes pulse {
      from {
        box-shadow: 0 0 20px rgba(255, 255, 255, 0.3),
                    inset 0 0 5px rgba(255, 255, 255, 0.2);
      }
      to {
        box-shadow: 0 0 35px rgba(255, 255, 255, 0.6),
                    inset 0 0 15px rgba(255, 255, 255, 0.3);
      }
    }

    #ctime {
      font-size: 2.5rem;
      line-height: 1.5;
      letter-spacing: 1px;
    }

    h1 {
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="clock">
    <h1 id="ctime"></h1>
  </div>

  <script>
    function maketime() {
      let cData = new Date();
      console.log(cData);

      let DataTime = `Date-${cData.getDate()}:${cData.getMonth() + 1}:${cData.getFullYear()}
      <br> <br> Time-${cData.getHours()}:${cData.getMinutes()}:${cData.getSeconds()}`;
      document.getElementById('ctime').innerHTML = DataTime;
    }

    setInterval(maketime, 1000);
  </script>
</body>
</html>
