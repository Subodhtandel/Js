<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Keyboard Backlight Toggle</title>
    <style>
        :root{
            --bg1:#0f172a;
            --bg2:#071233;
            --card:#0b1220cc;
            --accent:#ffd166;
            --muted:#9aa4b2;
            --glass: rgba(255,255,255,0.04);
            --radius:14px;
        }

        html,body{
            height:100%;
            margin:0;
            font-family:Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
            background: linear-gradient(180deg,var(--bg1),var(--bg2));
            color:#e6eef8;
            -webkit-font-smoothing:antialiased;
            -moz-osx-font-smoothing:grayscale;
        }

        .wrap{
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:32px;
        }

        .card{
            width:100%;
            max-width:720px;
            background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(0,0,0,0.06));
            border-radius:var(--radius);
            padding:28px;
            box-shadow: 0 10px 30px rgba(2,6,23,0.6);
            border:1px solid rgba(255,255,255,0.03);
            display:flex;
            gap:20px;
            align-items:center;
        }

        .left{
            flex:1;
        }

        h1{
            margin:0 0 8px 0;
            font-size:1.45rem;
            letter-spacing: -0.2px;
        }

        p.lead{
            margin:0 0 16px 0;
            color:var(--muted);
            line-height:1.4;
        }

        .controls{
            display:flex;
            gap:12px;
            align-items:center;
            flex-wrap:wrap;
        }

        .btn{
            appearance:none;
            border:0;
            padding:10px 16px;
            border-radius:10px;
            cursor:pointer;
            font-weight:600;
            color:#061025;
            background: linear-gradient(180deg,var(--accent), #ffb84d);
            box-shadow: 0 6px 18px rgba(255,177,64,0.18), inset 0 -2px 0 rgba(0,0,0,0.12);
            transition: transform .12s ease, box-shadow .12s ease, filter .12s ease;
        }

        .btn.secondary{
            background: transparent;
            color:var(--accent);
            border:1px solid rgba(255,209,102,0.12);
            box-shadow:none;
            backdrop-filter: blur(4px);
            padding:9px 14px;
        }

        .btn:active{ transform: translateY(1px) scale(.995); }
        .btn:focus{ outline:2px solid rgba(255,209,102,0.18); outline-offset:3px; }

        .preview{
            width:140px;
            display:flex;
            align-items:center;
            justify-content:center;
        }

        #myImage{
            width:100px;
            height:100px;
            object-fit:contain;
            border-radius:12px;
            background:var(--glass);
            padding:8px;
            box-shadow: 0 8px 30px rgba(2,6,23,0.6), 0 2px 8px rgba(0,0,0,0.35);
            transition: filter .18s ease, transform .18s ease;
            transform-origin:center;
        }

        /* subtle glow when "on" */
        .glow{
            filter: drop-shadow(0 6px 18px rgba(255,209,102,0.25)) saturate(1.1) brightness(1.05);
            transform: translateY(-2px) scale(1.02);
        }

        .note{
            margin-top:12px;
            font-size:.9rem;
            color:var(--muted);
        }

        @media (max-width:600px){
            .card{ flex-direction:column; align-items:flex-start; padding:20px; }
            .preview{ width:100%; display:flex; justify-content:flex-start; margin-top:6px; }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <section class="card" role="region" aria-label="Keyboard backlight toggle">
            <div class="left">
                <h1>Keyboard Backlight Toggle</h1>
                <p class="lead">Click the buttons to toggle the image. If a local helper server is running, the page will also request a system command to change the real keyboard backlight.</p>

                <div class="controls" role="group" aria-label="Backlight controls">
                    <button id="onBtn" class="btn" type="button">Turn on</button>
                    <button id="offBtn" class="btn secondary" type="button">Turn off</button>
                    <span class="note">Requires a local server script to actually change hardware.</span>
                </div>
            </div>

            <div class="preview" aria-hidden="false">
                <img id="myImage" src="pic_bulboff.gif" alt="Keyboard backlight preview">
            </div>
        </section>
    </div>

    <script>
        const img = document.getElementById('myImage');
        const onBtn = document.getElementById('onBtn');
        const offBtn = document.getElementById('offBtn');

        function sendRequest(path) {
            fetch(path, { method: 'POST' })
                .then(r => {
                    // tolerate non-json responses
                    return r.ok ? r.json().catch(() => ({ ok: true })) : Promise.reject(new Error('bad response'));
                })
                .then(j => console.log('response', j))
                .catch(e => console.error('request failed', e));
        }

        onBtn.addEventListener('click', () => {
            img.src = 'pic_bulbon.gif';
            img.classList.add('glow');
            sendRequest('/keyboard/on');
        });

        offBtn.addEventListener('click', () => {
            img.src = 'pic_bulboff.gif';
            img.classList.remove('glow');
            sendRequest('/keyboard/off');
        });
    </script>
</body>
</html>
