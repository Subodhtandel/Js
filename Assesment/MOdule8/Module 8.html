<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Management - Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-10">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h1 class="h4 mb-3">Hotel Guest Registration</h1>
                        <p class="text-muted mb-4">Fill all fields before submitting.</p>

                        <div id="formMessage" class="alert d-none" role="alert"></div>

                        <form id="guestForm" novalidate>
                            <div class="row g-3">
                                <div class="col-12 col-md-6">
                                    <label for="fullName" class="form-label">Full Name</label>
                                    <input type="text" class="form-control" id="fullName" name="fullName" required>
                                    <div class="invalid-feedback"></div>
                                </div>

                                <div class="col-12 col-md-6">
                                    <label for="phone" class="form-label">Phone Number</label>
                                    <input type="text" class="form-control" id="phone" name="phone" inputmode="numeric" required>
                                    <div class="invalid-feedback"></div>
                                </div>

                                <div class="col-12 col-md-6">
                                    <label for="email" class="form-label">Email Address</label>
                                    <input type="email" class="form-control" id="email" name="email" required>
                                    <div class="invalid-feedback"></div>
                                </div>

                                <div class="col-12 col-md-6">
                                    <label for="aadhar" class="form-label">Aadhar Card Number</label>
                                    <input type="text" class="form-control" id="aadhar" name="aadhar" inputmode="numeric" required>
                                    <div class="invalid-feedback"></div>
                                </div>

                                <div class="col-12">
                                    <label for="address" class="form-label">Address</label>
                                    <textarea class="form-control" id="address" name="address" rows="2" required></textarea>
                                    <div class="invalid-feedback"></div>
                                </div>

                                <div class="col-12 col-md-6">
                                    <label for="checkInDate" class="form-label">Check In Date</label>
                                    <input type="date" class="form-control" id="checkInDate" name="checkInDate" required>
                                    <div class="invalid-feedback"></div>
                                </div>

                                <div class="col-12 col-md-6">
                                    <label for="checkOutDate" class="form-label">Check Out Date</label>
                                    <input type="date" class="form-control" id="checkOutDate" name="checkOutDate" required>
                                    <div class="invalid-feedback"></div>
                                </div>

                                <div class="col-12 col-md-6">
                                    <label for="adults" class="form-label">No of Adult</label>
                                    <input type="number" class="form-control" id="adults" name="adults" min="1" required>
                                    <div class="invalid-feedback"></div>
                                </div>

                                <div class="col-12">
                                    <label for="purpose" class="form-label">Purpose of Visit</label>
                                    <textarea class="form-control" id="purpose" name="purpose" rows="2" required></textarea>
                                    <div class="invalid-feedback"></div>
                                </div>

                                <div class="col-12 d-flex gap-2">
                                    <button type="submit" class="btn btn-primary">Submit</button>
                                    <button type="reset" class="btn btn-outline-secondary">Reset</button>
                                    <a href="./view.html" class="btn btn-success ms-auto">View Submissions</a>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="./js/formHandler.js"></script>
</body>
</html>
