<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Management - Submissions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-4">
        <div class="d-flex flex-wrap gap-2 align-items-center mb-3">
            <h1 class="h4 m-0">Guest Submissions</h1>
            <a href="./Module 8.html" class="btn btn-outline-primary ms-auto">Back to Form</a>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <div class="mb-3">
                    <label for="searchInput" class="form-label">Search by Name or Date</label>
                    <input type="text" id="searchInput" class="form-control" placeholder="Type name or YYYY-MM-DD">
                </div>

                <div id="tableWrapper" class="table-responsive">
                    <table class="table table-bordered table-striped align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>Full Name</th>
                                <th>Phone</th>
                                <th>Email</th>
                                <th>Aadhar</th>
                                <th>Address</th>
                                <th>Check In</th>
                                <th>Check Out</th>
                                <th>Adults</th>
                                <th>Purpose</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="submissionTableBody"></tbody>
                    </table>
                </div>
                <p id="emptyState" class="text-center text-muted d-none mb-0">No data found.</p>
            </div>
        </div>
    </div>

    <script type="module" src="./js/submissionViewer.js"></script>
</body>
</html>
